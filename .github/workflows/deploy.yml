# Builds the site and publishes dist/ to the gh-pages branch, which GitHub
# Pages serves. Runs on every push to main — including saves from the admin
# page (/admin), so content edits go live in a minute or two.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push deploys; an older in-flight run is cancelled.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Generates the CMS config, checks it covers all content, builds, and
      # writes the per-route HTML pages.
      - run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Deploy ${{ github.sha }}"
