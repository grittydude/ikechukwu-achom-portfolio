    <script>
      // GitHub Pages SPA routing fix — restores the real path that 404.html
      // encoded into the query string before React Router mounts.
      // Pairs with public/404.html. Based on the well-known rafgraph technique.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded.shift() + (decoded.length ? "?" + decoded.join("&") : "") + l.hash
          );
        }
      })(window.location);
    </script>
